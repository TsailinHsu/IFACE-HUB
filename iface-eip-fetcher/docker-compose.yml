services:
  iface-eip-fetcher:
    container_name: ${CONTAINER_NAME:-iface-eip-fetcher}
    image: ${IMAGE_NAME:-iface-eip-fetcher}:1.0
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - iface-net
    environment:
      EIP_CONFIG:   ${EIP_CONFIG:-config/eip.yml}
      EIP_BASE_URL: ${EIP_BASE_URL:-https://api-eip.speeding-rocket.com}
      EIP_MODULE:   ${EIP_MODULE:-EIP}
      EIP_ACCESS_KEY: ${EIP_ACCESS_KEY}
      DB_API_URL:   ${DB_API_URL:-http://iface-db:8000}
    restart: "no"             # 由 cron + run-job.sh 觸發，不自動重啟

networks:
  iface-net:
    external: true

# 多公司部署：
#   每家公司準備獨立的 .env.<company>，設定各自的：
#     CONTAINER_NAME, IMAGE_NAME, EIP_CONFIG, EIP_BASE_URL,
#     EIP_MODULE, EIP_ACCESS_KEY, DB_API_URL
#
#   執行：./run-job.sh -e .env.<company> <job>
#   建置：docker compose --env-file .env.<company> build
